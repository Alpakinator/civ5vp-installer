[package]
name = "civ5vp-toolchain"
description = "Toolchain Bootstrap for the Civ 5 VP Installer: pinned downloads and in-process SDK extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Why this crate exists at all: the Core has zero dependencies on purpose
# (CODING_STANDARDS.md rule 1), and Toolchain Bootstrap needs an HTTP client, a hasher and
# three archive parsers. Keeping them here leaves the Core plain std and still lets the Core
# consume this crate through the `ToolchainRunner` boundary. Nothing here may depend on
# egui/eframe either — this crate is as headless as the Core.
[dependencies]
civ5vp-core = { path = "../core" }

# HTTP for the two pinned downloads. Pure Rust with rustls — no OpenSSL, so the deliverable
# stays one static binary with no runtime dependencies (rule 17, ADR-0002). `gzip` is off on
# purpose: a resumed download counts bytes against a `Range` header, and transparent
# content-decoding would make the count mean something different from the file on disk.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

# SHA-256, so a download can be proven to be the artifact `docs/pinned-artifacts.md` names.
# Pure Rust, RustCrypto, no C toolchain.
sha2 = "0.10"

# MSI table parsing: each SDK MSI carries the CAB-name-to-real-path mapping that
# `docs/pinned-artifacts.md` says must be honoured rather than guessed. Pure Rust (mdsteele).
msi = "0.10"

# CAB decompression (MSZIP via flate2, LZX via the pure-Rust `lzxd`). Same author, same
# reason: the alternative is shelling out to a tool the user does not have (rule 5).
cab = "0.6"

# The portable LLVM release is a .tar.xz. `tar` reads the archive, `lzma-rs` does the xz
# decode — both pure Rust. `xattr` is off: extended attributes are not wanted here and the
# feature only widens the platform surface.
tar = { version = "0.4", default-features = false }
lzma-rs = "0.3"

# ISO9660 is *not* a dependency. The format is 16-sector offset + volume descriptors +
# directory records, we need four known paths out of it, and every candidate crate on
# crates.io is either incomplete or unmaintained. See `src/iso9660.rs`.

[dev-dependencies]
# Temporary Toolchain Cache roots and staging directories for the tests.
tempfile = "3.27"
