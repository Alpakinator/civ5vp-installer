[package]
name = "civ5vp-installer"
description = "Civ 5 VP Installer - the egui shell over the headless Core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "civ5vp_installer"
path = "src/lib.rs"

[[bin]]
name = "civ5vp-installer"
path = "src/main.rs"

[dependencies]
civ5vp-core = { path = "../core" }
civ5vp-modpack = { path = "../modpack" }
# The two real boundaries, composed in `src/wiring.rs`. The shell itself never touches their
# internals - the Core sees them only as its two traits (rule 2).
civ5vp-sources = { path = "../sources" }
civ5vp-toolchain = { path = "../toolchain" }
# The launch-time new-version ping (user story 27) - the same HTTP client the toolchain
# already brings, so this adds no new tree.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
# ADR-0002: egui, hand-themed, no webview. Default features give us wgpu + AccessKit, and
# AccessKit is what egui_kittest drives the shell through.
eframe = "0.35"
egui = "0.35"
# Writing the PNGs that `--screenshot` produces. Pure Rust; `png` only, no other decoders.
image = { version = "0.25", default-features = false, features = ["png"] }
# The `Browse` buttons' folder picker, drawn inside the window (rule 17: every dependency
# needs a reason). Rule 5 rules out the alternatives: every portable wrapper over the
# platform's own dialog either shells out to `zenity` on Linux without an XDG portal, or needs
# GTK headers to build and `libgtk-3.so` to run. This is pure Rust and adds no C toolchain -
# `sysinfo` and `directories` for the disk and Home shortcuts, nothing more. Default features
# off: they are `serde` and `default_fonts`, and nothing about a pick is persisted.
# 0.15 needs egui 0.36; this workspace is on 0.35, so 0.14.1 is the pairing.
egui-file-dialog = { version = "0.14.1", default-features = false }

# Only the Windows resource compiler needs this, and only on a Windows host - see `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# The render harness (ticket 01) and the snapshot baselines every styled screen needs (rule 15).
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
tempfile = "3.27"
