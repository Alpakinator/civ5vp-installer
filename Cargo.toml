[workspace]
resolver = "3"
members = ["crates/core", "crates/installer", "crates/toolchain"]
# All of them, so a bare `cargo test` at the root really is the whole suite. `cargo run`
# still resolves without `-p` because the installer holds the workspace's only binary.
default-members = ["crates/core", "crates/installer", "crates/toolchain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
